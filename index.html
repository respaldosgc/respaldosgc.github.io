
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estamos renovando nuestro sitio | Respaldos G&C</title>

  <meta name="description" content="Respaldos G&C está renovando su sitio web. Muy pronto vas a poder conocer todos nuestros modelos de respaldos de cama y sillones.">

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 45px;
    }

    .logo span {
      color: #c9a45c;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      border: 2px solid #c9a45c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #c9a45c;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.1;
      margin-bottom: 22px;
    }

    h1 span {
      color: #c9a45c;
    }

    p {
      color: #cfcfcf;
      font-size: 18px;
      line-height: 1.7;
      max-width: 580px;
      margin: 0 auto 35px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 28px;
      background: #c9a45c;
      color: #111111;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .footer {
      margin-top: 55px;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 25px;
        margin-bottom: 35px;
      }

      .icon {
        width: 70px;
        height: 70px;
        font-size: 29px;
      }

      p {
        font-size: 16px;
      }

      .button {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      RESPALDOS <span>G&C</span>
    </div>

    <div class="icon">
      ✦
    </div>

    <h1>
      Estamos renovando<br>
      nuestro <span>sitio web</span>
    </h1>

    <p>
      Estamos trabajando para ofrecerte una nueva experiencia,
      con todos nuestros modelos de respaldos de cama, sillones
      y productos para transformar tus espacios.
    </p>

    <a
      class="button"
      href="https://wa.me/5491159565865"
      target="_blank"
      rel="noopener noreferrer"
    >
      Consultanos por WhatsApp →
    </a>

    <div class="footer">
      © Respaldos G&C — Todos los derechos reservados
    </div>

  </main>

</body>
</html>
